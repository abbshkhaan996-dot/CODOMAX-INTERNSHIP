<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile — Abbsh Blogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <span class="stamp"><span>AB</span></span>
      <span class="brand-text">Abbsh Blogs<small>notes worth keeping</small></span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primary-nav"></nav>
  </div>
</header>

<main class="page-main">
  <section class="create-shell">
    <div class="wrap">
      <p class="eyebrow">Your account</p>
      <h1>Profile</h1>
      <p class="sub" style="margin-bottom:32px;">Update your name, change your password, or sign out below.</p>

      <div class="create-card">
        <div class="form-msg" id="form-msg"></div>

        <form id="profile-form" novalidate>
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" disabled style="opacity:0.6; cursor:not-allowed;">

          <hr style="border:none; border-top:2px solid var(--ink); margin:28px 0; opacity:0.15;">

          <p class="eyebrow" style="margin-bottom:14px;">Change password <span style="text-transform:none;letter-spacing:0;">(optional)</span></p>

          <label for="current-password">Current password</label>
          <input type="password" id="current-password" name="currentPassword" placeholder="Leave blank if not changing your password">

          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="newPassword" placeholder="At least 6 characters">

          <label for="confirm-new-password">Confirm new password</label>
          <input type="password" id="confirm-new-password" name="confirmNewPassword">

          <div class="form-actions">
            <button type="button" class="btn btn-outline" id="logout-btn">Log out</button>
            <button type="submit" class="btn btn-accent" id="submit-btn">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">Abbsh Blogs — a browser-only demo. Nothing you write here leaves your device.</div>
</footer>

<script src="js/app.js"></script>
<script src="js/blog.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    initNav("profile");
  });
</script>
</body>
</html>
